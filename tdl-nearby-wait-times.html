<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>近くの待ち時間</title>
<style>
  :root{
    --bg:#0f1729;
    --bg-elevated:#16213d;
    --card:#1c2947;
    --ink:#f5f3ea;
    --ink-dim:#a9b2c8;
    --line:#2a3a5f;
    --gold:#e8b854;
    --green:#5fb389;
    --amber:#e8a154;
    --red:#d9695a;
    --font-display: 'Cinzel', 'Georgia', serif;
    --font-body: 'Fira Sans', 'Hiragino Sans', sans-serif;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]){
      --bg:#f4f1e8;
      --bg-elevated:#ffffff;
      --card:#ffffff;
      --ink:#1c2947;
      --ink-dim:#5a6180;
      --line:#e0dccd;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f1e8;
    --bg-elevated:#ffffff;
    --card:#ffffff;
    --ink:#1c2947;
    --ink-dim:#5a6180;
    --line:#e0dccd;
  }

  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    padding: 20px 16px 40px;
    background:
      radial-gradient(circle at 15% 0%, rgba(232,184,84,0.08), transparent 55%),
      var(--bg);
  }

  header {
    text-align: center;
    padding: 8px 0 22px;
  }
  .crest {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 13px;
    margin-top: 6px;
  }

  #status {
    max-width: 480px;
    margin: 0 auto 18px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    min-height: 20px;
  }

  #locateBtn {
    display: block;
    margin: 0 auto 22px;
    background: var(--gold);
    color: #1c1408;
    border: none;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 30px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(232,184,84,0.25);
  }
  #locateBtn:active { transform: scale(0.97); }
  #locateBtn:disabled { opacity: 0.6; }

  #list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 12px;
  }
  .rank {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--gold);
    text-align: center;
  }
  .info { min-width: 0; }
  .name {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dist {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 3px;
  }
  .wait {
    text-align: right;
    white-space: nowrap;
  }
  .wait .mins {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .wait .unit {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .wait.short .mins { color: var(--green); }
  .wait.mid .mins { color: var(--amber); }
  .wait.long .mins { color: var(--red); }
  .wait.closed .mins { color: var(--ink-dim); font-size: 14px; }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--ink-dim);
    opacity: 0.8;
    line-height: 1.7;
  }

  .spinner {
    display:inline-block;
    width:16px; height:16px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align:center;
    color: var(--ink-dim);
    font-size: 14px;
    padding: 40px 20px;
  }
</style>
</head>
<body>

<header>
  <div class="crest">TOKYO DISNEYLAND</div>
  <h1>近くの待ち時間</h1>
  <div class="sub">現在地から近いアトラクション5件</div>
</header>

<div id="status"></div>
<button id="locateBtn">現在地から探す</button>

<div id="list"></div>

<footer>
  待ち時間データ: ThemeParks.wiki（非公式）<br>
  位置情報は端末内でのみ使用し、送信・保存されません
</footer>

<script>
const API_BASE = "https://api.themeparks.wiki/v1";
const DESTINATION_SLUG = "tokyodisneyresort";
const PARK_NAME_MATCH = "Disneyland"; // "Tokyo Disneyland" を含むパーク名にマッチ（DisneySea を除外）

const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const btn = document.getElementById('locateBtn');

function setStatus(html) {
  statusEl.innerHTML = html;
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + " m";
  return (m / 1000).toFixed(1) + " km";
}

function waitClass(mins) {
  if (mins === null) return "closed";
  if (mins <= 20) return "short";
  if (mins <= 50) return "mid";
  return "long";
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

async function findLandParkId() {
  const dests = await fetchJSON(`${API_BASE}/destinations`);
  const list = dests.destinations || [];
  const tdr = list.find(d => d.slug === DESTINATION_SLUG) ||
              list.find(d => (d.name || "").toLowerCase().includes("tokyo disney"));
  if (!tdr) throw new Error("東京ディズニーリゾートが見つかりませんでした");

  const parks = tdr.parks || [];
  const land = parks.find(p => (p.name || "").includes(PARK_NAME_MATCH) && !(p.name || "").includes("Sea"));
  if (!land) throw new Error("ディズニーランドのパーク情報が見つかりませんでした");
  return land.id;
}

async function getAttractionsWithCoords(parkId) {
  const children = await fetchJSON(`${API_BASE}/entity/${parkId}/children`);
  const entities = (children.children || []).filter(e =>
    e.entityType === "ATTRACTION" &&
    e.location && typeof e.location.latitude === "number" && typeof e.location.longitude === "number"
  );
  return entities;
}

async function getLiveWaitTimes(parkId) {
  const live = await fetchJSON(`${API_BASE}/entity/${parkId}/live`);
  const map = {};
  for (const item of (live.liveData || [])) {
    let mins = null;
    let status = item.status;
    if (item.queue && item.queue.STANDBY && typeof item.queue.STANDBY.waitTime === "number") {
      mins = item.queue.STANDBY.waitTime;
    }
    map[item.id] = { mins, status };
  }
  return map;
}

function renderEmpty(msg) {
  listEl.innerHTML = `<div class="empty">${msg}</div>`;
}

function renderList(items) {
  listEl.innerHTML = items.map((it, i) => {
    const cls = waitClass(it.mins);
    let waitHTML;
    if (it.mins === null) {
      const label = it.status === "CLOSED" ? "運休中" : it.status === "REFURBISHMENT" ? "整備中" : "情報なし";
      waitHTML = `<div class="wait ${cls}"><div class="mins">${label}</div></div>`;
    } else {
      waitHTML = `<div class="wait ${cls}"><div class="mins">${it.mins}</div><div class="unit">分待ち</div></div>`;
    }
    return `
      <div class="row">
        <div class="rank">${i + 1}</div>
        <div class="info">
          <div class="name">${it.name}</div>
          <div class="dist">${formatDist(it.distance)}</div>
        </div>
        ${waitHTML}
      </div>
    `;
  }).join("");
}

async function run() {
  btn.disabled = true;
  renderEmpty("");
  setStatus('<span class="spinner"></span>位置情報を取得しています…');

  if (!navigator.geolocation) {
    setStatus("この端末では位置情報が使えません");
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    try {
      setStatus('<span class="spinner"></span>アトラクション情報を取得しています…');
      const parkId = await findLandParkId();
      const [attractions, waitMap] = await Promise.all([
        getAttractionsWithCoords(parkId),
        getLiveWaitTimes(parkId)
      ]);

      const withDist = attractions.map(a => ({
        id: a.id,
        name: a.name,
        distance: haversineMeters(latitude, longitude, a.location.latitude, a.location.longitude),
        mins: waitMap[a.id] ? waitMap[a.id].mins : null,
        status: waitMap[a.id] ? waitMap[a.id].status : null
      }));

      withDist.sort((a, b) => a.distance - b.distance);
      const nearest5 = withDist.slice(0, 5);

      if (nearest5.length === 0) {
        renderEmpty("アトラクション情報を取得できませんでした");
        setStatus("");
      } else {
        renderList(nearest5);
        const now = new Date();
        setStatus(`更新: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`);
      }
    } catch (err) {
      console.error(err);
      setStatus("");
      renderEmpty("データの取得に失敗しました。時間をおいて再度お試しください。");
    } finally {
      btn.disabled = false;
    }
  }, (err) => {
    let msg = "位置情報を取得できませんでした";
    if (err.code === 1) msg = "位置情報の利用が許可されていません。設定から許可してください。";
    else if (err.code === 2) msg = "現在地を特定できませんでした";
    else if (err.code === 3) msg = "位置情報の取得がタイムアウトしました";
    setStatus(msg);
    btn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}

btn.addEventListener('click', run);
</script>

</body>
</html>
